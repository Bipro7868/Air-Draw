workflows:
  airdraw-android:
    name: AirDraw3D Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Download hand tracking model
        script: mkdir -p app/src/main/assets
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -o app/src/main/assets/hand_landmarker.task
      - name: Build debug APK
        script: |
          gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
